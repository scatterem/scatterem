[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scatterem"
version = "0.2.0"
description = "Fused full-field STEM: direct ptychography, tilt-corrected dark field, and their SSNR-weighted fusion"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Shengbo You" },
    { name = "Philipp Pelz", email = "philipp.pelz@fau.de" },
]
keywords = [
    "electron microscopy",
    "4D-STEM",
    "ptychography",
    "dark field",
    "phase retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

# Every entry is imported by the shipped code. The list is checked mechanically
# against the tree by `scripts/gate_public.py`, in both directions: an import
# with no declaration fails, and so does a declaration nothing imports. That
# check exists because `ase` was once imported at module scope and never
# declared, which broke `import scatterem` in any clean environment.
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "matplotlib>=3.7.0",
    "torch>=2.5.0",
    "warp-lang>=1.7.0",
    "h5py>=3.8.0",
    # registers the bslz4 (32008) filter the Zenodo HDF5 data is compressed with
    "hdf5plugin>=4.0",
    "scikit-image>=0.21.0",
    "tqdm>=4.66.0",
    # fetches the Zenodo datasets on first use
    "gdown>=4.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.urls]
Homepage = "https://github.com/scatterem/scatterem"
Paper = "https://doi.org/10.1002/advs.76620"
Data = "https://doi.org/10.5281/zenodo.18008901"

[tool.hatch.build.targets.wheel]
packages = ["scatterem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F401", "F403", "F405", "F811", "E731"]
