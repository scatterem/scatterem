project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - docs/*.qmd

website:
  title: "scatterem"
  favicon: favicon.png
  description: "Fused full-field 4D-STEM reconstruction, BiP-PRISM core-loss STEM-EELS simulation, and elastic PRISM"
  site-url: "https://scatterem.github.io/scatterem"
  repo-url: "https://github.com/scatterem/scatterem"
  # No "source" action: docs/api.qmd is generated in CI and is not in the
  # repository, so its "View source" link would be a 404. Quarto 1.7 has no
  # per-page override for repo-actions.
  repo-actions: [issue]
  navbar:
    logo: logo.png
    logo-alt: "scatterem"
    left:
      - text: "Get started"
        href: docs/install.qmd
      - text: "The method"
        href: docs/method.qmd
      - text: "Figure scripts"
        href: docs/figures.qmd
      - text: "Simulate STEM-EELS"
        href: docs/eels.qmd
      - text: "API"
        href: docs/api.qmd
    right:
      - icon: github
        href: "https://github.com/scatterem/scatterem"
  sidebar:
    style: floating
    contents:
      - index.qmd
      - section: "Get started"
        contents:
          - docs/install.qmd
          - docs/quickstart.qmd
      - section: "Background"
        contents:
          - docs/method.qmd
          - docs/calibration.qmd
      - section: "Simulation"
        contents:
          - docs/eels.qmd
          - docs/bip-prism.qmd
          - docs/prism.qmd
      - section: "Reference"
        contents:
          - docs/figures.qmd
          - docs/migrating.qmd
          - docs/api.qmd
  page-footer:
    left: "Apache-2.0"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    # Listing `dark` FIRST is what makes it the default: Quarto reads the order of
    # these keys to emit `authorPrefersDark`, which decides the scheme a first-time
    # visitor gets. The keys keep their honest meaning, so Quarto still pairs the
    # syntax-highlighting sheets correctly -- putting the dark bootswatch in the
    # `light` slot instead does make the page dark, but then the light syntax
    # colours land on dark paper and the code becomes unreadable.
    theme:
      dark: [darkly, theme.scss]
      light: [cosmo, theme.scss]
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    grid:
      sidebar-width: 250px
      body-width: 900px

# Executed code is cached, so a rebuild does not re-run a reconstruction.
execute:
  freeze: auto
